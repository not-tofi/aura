<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tipos | Definición Nails</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="tipos">
    <button id="abrir-menu" class="btn-opciones" type="button" aria-expanded="false" aria-controls="menu-lateral">
      <span class="opcion" aria-label="Abrir menú"></span>
      <span class="logoo" aria-label="Logo dentro del botón"></span>
      <p style="color: #0075a3; margin: 0; font-weight: 800;">menu</p>
    </button>

    <div id="menu-overlay" class="menu-overlay" aria-hidden="true"></div>

    <aside id="menu-lateral" class="menu-lateral" aria-label="Menú lateral" aria-hidden="true">
      <div class="menu-header">
        <h3>Menú</h3>
      </div>

      <nav class="menu-nav" aria-label="Menú principal">
        <a href="index.html">Inicio</a>
        <a href="turnos.html">Sala</a>
        <a href="generarturno.html">Agregar turno</a>
        <a href="tipos.html" class="active">Tipos</a>
        <a href="cuentabancaria.html">Cuenta</a>
        <a href="historial.html">Historial</a>
      </nav>
    </aside>

    <div class="app-shell">
      <main class="content">
        <section class="card">
          <h2>Tipos de corte y precios</h2>
          <div id="listaTipos"></div>

          <div class="fila" style="margin-top: 12px;">
            <div>
              <input id="nuevoTipoNombre" type="text" placeholder="Nombre (ej: Esculpidas)" />
            </div>
            <div>
              <input id="nuevoTipoPrecio" type="number" placeholder="Precio" />
            </div>
          </div>

          <button type="button" class="secundario" onclick="agregarTipo()">Agregar tipo</button>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
  </body>
</html>
